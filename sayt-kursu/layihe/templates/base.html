<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Qeydlər{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="{{ url_for('index') }}">Qeydlər</a>
            <div class="linkler">
                <a href="{{ url_for('elaqe') }}">Əlaqə</a>
                {% if istifadeci %}
                    <a href="{{ url_for('yeni') }}">Yeni qeyd</a>
                    <form action="{{ url_for('cixis') }}" method="POST">
                        <button class="link">Çıxış</button>
                    </form>
                {% else %}
                    <a href="{{ url_for('login') }}">Daxil ol</a>
                    <a href="{{ url_for('qeydiyyat') }}">Qeydiyyat</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <main>
        {% for kat, m in get_flashed_messages(with_categories=true) %}
            <div class="bildiris {{ kat }}">{{ m }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
