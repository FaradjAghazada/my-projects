{% extends "base.html" %}
{% block title %}Qeyd{% endblock %}
{% block content %}
<form method="POST" class="forma">
    <label for="basliq">Başlıq</label>
    <input id="basliq" name="basliq" value="{{ basliq or '' }}" required>
    <label for="metn">Mətn</label>
    <textarea id="metn" name="metn" rows="8" maxlength="500">{{ metn or '' }}</textarea>
    <small id="sayac"></small>
    <button>Yadda saxla</button>
</form>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='forma.js') }}"></script>{% endblock %}
