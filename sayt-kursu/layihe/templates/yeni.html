{% extends "base.html" %}
{% block title %}Yeni yazı{% endblock %}
{% block content %}
<h1>Yeni yazı</h1>
<form method="POST" class="forma">
    <label for="basliq">Başlıq</label>
    <input id="basliq" name="basliq" value="{{ basliq or '' }}" required>
    <label for="metn">Mətn</label>
    <textarea id="metn" name="metn" rows="8" required>{{ metn or '' }}</textarea>
    <button class="duyme">Yadda saxla</button>
</form>
{% endblock %}
